<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#321e31">
  <title>Dredge Family Olympics Stream</title>
  <link rel="icon" href="/dredge-family-thanksgiving-olympics/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/dredge-family-thanksgiving-olympics/styles.css">
  <link rel="stylesheet" href="/dredge-family-thanksgiving-olympics/stream.css">
  <script type="module" src="/dredge-family-thanksgiving-olympics/stream.js"></script>
  <meta name="scoreboard-api-origin" content="https://dredge-family-thanksgiving-olympics.active-otter-5137.chatgpt.site">
</head>
<body class="stream-view">
  <main class="stream-stage" id="stream-stage">
    <div class="stream-intro">
      <div>
        <p class="stream-family">Dredge Family Thanksgiving Olympics</p>
        <h1 id="stream-event">Darts</h1>
        <p class="stream-rule" id="stream-rule"></p>
      </div>
      <dl class="stream-day" id="stream-day" aria-label="Tournament timeline, Central time" hidden>
        <div><dt>Games start</dt><dd id="stream-start"></dd></div>
        <div><dt>Catch-up</dt><dd id="stream-catch-up"></dd></div>
        <div><dt>Dinner</dt><dd id="stream-dinner"></dd></div>
      </dl>
      <div class="stream-feed">
        <p class="stream-connection" id="stream-connection" role="status">Connecting</p>
        <p class="stream-next" id="stream-next"></p>
        <div class="stream-timer" aria-hidden="true"><span id="stream-time"></span></div>
      </div>
    </div>

    <div class="stream-board" id="stream-board">
      <section class="stream-panel stream-standings" aria-labelledby="stream-standings-title">
        <div class="stream-panel-heading">
          <h2 id="stream-standings-title">Standings</h2>
        </div>
        <table class="stream-table">
          <thead>
            <tr>
              <th scope="col"><span aria-label="Rank">#</span></th>
              <th scope="col">Team</th>
              <th scope="col"><abbr title="Wins">W</abbr></th>
              <th scope="col"><abbr title="Losses">L</abbr></th>
              <th scope="col"><abbr title="Placement points">Pts</abbr></th>
            </tr>
          </thead>
          <tbody id="stream-standings"></tbody>
        </table>
        <p class="stream-standing-note" id="stream-standing-note"></p>
      </section>

      <section class="stream-panel stream-schedule" aria-labelledby="stream-schedule-title">
        <div class="stream-panel-heading">
          <h2 id="stream-schedule-title">Bracket schedule</h2>
          <p id="stream-played"></p>
        </div>
        <div class="stream-rounds" id="stream-rounds"></div>
      </section>
    </div>

    <section class="stream-panel stream-overall" id="stream-overall" aria-labelledby="stream-overall-title" hidden>
      <div class="stream-panel-heading">
        <h2 id="stream-overall-title">Standings</h2>
        <p id="stream-overall-progress"></p>
      </div>
      <table class="stream-table">
        <thead>
          <tr>
            <th scope="col"><span aria-label="Rank">#</span></th>
            <th scope="col">Team</th>
            <th scope="col">Cornhole</th>
            <th scope="col">Darts</th>
            <th scope="col">Pool</th>
            <th scope="col">Total</th>
          </tr>
        </thead>
        <tbody id="stream-overall-rows"></tbody>
      </table>
      <p class="stream-standing-note" id="stream-overall-note"></p>
    </section>
  </main>
</body>
</html>
